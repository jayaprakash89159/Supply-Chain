<form id="bulk-actions" class="bulk-actions" method="post" action="{% if request.user.is_superuser %}{{ delete_url }}{% else %}{% url 'quotes:compose' %}{% endif %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="kind" value="{{ kind }}"><span class="hint">Tick vendors to request quotes by email{% if request.user.is_superuser %}, change their status or delete them{% endif %}.</span><span class="bulk-count"><span data-selected-count>0</span> selected</span><button class="button primary small" type="submit" formaction="{% url 'quotes:compose' %}" name="step" value="select" data-bulk-button>Request quotes <span aria-hidden="true">✉</span></button>{% if request.user.is_superuser %}<label class="bulk-status"><span class="visually-hidden">New status</span><select name="status"><option value="">Change status to…</option>{% for value, status_label in statuses %}<option value="{{ value }}">{{ status_label }}</option>{% endfor %}</select></label><button class="button small" type="submit" formaction="{{ status_url }}" data-bulk-button data-needs-status>Set status</button><button class="button danger small" type="submit" data-bulk-button data-confirm="Delete {n} selected {{ label }}(s)?">Delete selected</button>{% endif %}</form>
