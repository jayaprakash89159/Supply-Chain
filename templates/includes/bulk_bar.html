{% if request.user.is_superuser %}<form id="bulk-actions" class="bulk-actions" method="post" action="{{ delete_url }}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><span class="hint">Admin: tick rows, then change their status or delete them.</span><span class="bulk-count"><span data-selected-count>0</span> selected</span><label class="bulk-status"><span class="visually-hidden">New status</span><select name="status"><option value="">Change status to…</option>{% for value, status_label in statuses %}<option value="{{ value }}">{{ status_label }}</option>{% endfor %}</select></label><button class="button small" type="submit" formaction="{{ status_url }}" data-bulk-button data-needs-status>Set status</button><button class="button danger small" type="submit" data-bulk-button data-confirm="Delete {n} selected {{ label }}(s)?">Delete selected</button></form>{% endif %}
