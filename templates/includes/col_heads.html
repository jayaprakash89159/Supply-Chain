{% for h in headings %}<th class="col-head{% if h.active %} filtered{% endif %}{% if h.sorted %} sorted{% endif %}{% if h.css %} {{ h.css }}{% endif %}">{% if h.filterable or h.sortable %}<button type="button" class="col-button" data-col="{{ h.key }}" aria-haspopup="dialog" aria-expanded="false" title="Filter and sort {{ h.label }}">{{ h.label }}{% if h.sorted == 'asc' %}<span class="sort-mark" aria-label="sorted ascending">▲</span>{% elif h.sorted == 'desc' %}<span class="sort-mark" aria-label="sorted descending">▼</span>{% endif %}<svg class="funnel" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M2 3h12l-4.6 5.4V13l-2.8-1.4V8.4z" fill="{% if h.active %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>{% if h.active %}<span class="visually-hidden"> (filtered)</span>{% endif %}</button>{% else %}{{ h.label }}{% endif %}</th>{% endfor %}
