<label>Missing data<select name="missing"><option value="">Any profile</option><option value="any" {% if request.GET.missing == 'any' %}selected{% endif %}>Incomplete (missing anything)</option>{% for field, label in missing_choices %}<option value="{{ field }}" {% if request.GET.missing == field %}selected{% endif %}>Missing {{ label }}</option>{% endfor %}</select></label>{% if request.GET.duplicates == '1' %}<input type="hidden" name="duplicates" value="1">{% endif %}
